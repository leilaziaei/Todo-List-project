<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Advanced Todo List</title>
    <link rel="stylesheet" href="./src/css/styles.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1 id="titleHeder">Todo List</h1>
        <button id="darkModeToggle">Dark Mode</button>
      </header>

      <!-- Add Task Section -->
      <section id="addTaskSection" class="addTaskSection">

        <div class="item">
          <label for="taskTitle" class="labelText">Task Title:</label>
          <input type="text" id="taskTitle" placeholder="Task Title" /> 

        </div>

        <div class="item">
          <label for="taskDueDate" class="labelText">Due Date:</label> 
          <input type="date" id="taskDueDate" placeholder="YYYY-MM-DD" />
        </div>

        <div class="item">
          <label for="taskPriority" class="labelText">Priority:</label>
          <select id="taskPriority">
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
          </select>

        </div>
        <div class="item">
          <label for="taskNotes" class="labelText">Notes:</label>
          <textarea id="taskNotes" placeholder="Notes..."></textarea>
        </div>
        <button id="addTaskBtn">Add Task</button>
      </section>

      <!-- Filter Section -->
      <section id="filterSection">
        <input type="text" id="searchTasks" placeholder="Search tasks..." />
        <select id="filterPriority">
          <option value="">All Priorities</option>
          <option value="low">Low</option>
          <option value="medium">Medium</option>
          <option value="high">High</option>
        </select>
        <!-- Sort by Date -->
        <select id="sortByDate">
          <option value="">Sort by Date</option>
          <option value="asc">Ascending</option>
          <option value="desc">Descending</option>
        </select>
      </section>

      <section class="btn-item">
        <button id="exportTasksBtnPdf" class="exportTasksBtn">
          Export Tasks as PDF
        </button>
        <button
          id="exportTasksBtnecxel"
          class="exportTasksBtn exportTasksBtnecxel"
        >
          Export Tasks as Excel
        </button>
      </section>

      <!-- Task List -->
      <section id="taskListContainer">
        <div id="taskCategories">

            class="task medium"

      </section>
    </div>
